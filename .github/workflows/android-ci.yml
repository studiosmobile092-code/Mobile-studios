name: Mobile Labs Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build arm64-v8a Debug APK (libobs + Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK, NDK, CMake & Ninja
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.31.6

      - name: Install Ninja & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config git

      - name: Cache pinned libobs third_party build
        id: cache-libobs
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/prebuilt/arm64-v8a
            app/src/main/cpp/third_party/obs-studio
          key: libobs-57bfcf10a-arm64-${{ hashFiles('scripts/fetch_and_build_obs.sh', 'app/src/main/cpp/CMakeLists.txt') }}

      - name: Fetch & Build pinned libobs (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          chmod +x scripts/fetch_and_build_obs.sh
          bash scripts/fetch_and_build_obs.sh

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest -PwithLibObs=true --no-daemon

      - name: Assemble Debug APK (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./gradlew :app:assembleDebug -PwithLibObs=true --no-daemon

      - name: Verify APK ABI & Artifact Checksums
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          unzip -l "$APK" | grep -E "lib/arm64-v8a/.*\.so" || true

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-labs-debug-arm64-v8a
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          retention-days: 30
