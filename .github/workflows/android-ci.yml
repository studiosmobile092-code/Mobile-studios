name: Mobile Labs Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build, Test & Package Installable Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug.keystore exists for clean checkout signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run All Unit & Robolectric Tests (Phase 1-3)
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK & Record SHA-256
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-labs-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          retention-days: 30

  build-native-libobs-apk:
    name: Native libobs arm64-v8a NDK Build (Upstream Pinned)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.31.6

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Ninja & pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config git

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache pinned libobs third_party build
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/prebuilt/arm64-v8a
            app/src/main/cpp/third_party/obs-studio
          key: libobs-57bfcf10a-arm64-${{ hashFiles('scripts/fetch_and_build_obs.sh', 'app/src/main/cpp/CMakeLists.txt') }}

      - name: Fetch & Build pinned libobs (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          chmod +x scripts/fetch_and_build_obs.sh
          bash scripts/fetch_and_build_obs.sh

      - name: Assemble Native libobs Debug APK (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: gradle :app:assembleDebug -PwithLibObs=true --no-daemon

      - name: Upload Native libobs APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-labs-libobs-arm64-v8a
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
